services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
        required: false   # lets the bot run alone when MONGO_URI points to Atlas
    volumes:
      - ./assets:/app/assets:ro

  # Local MongoDB. Enabled by COMPOSE_PROFILES=local-mongo in .env; remove that line to use Atlas instead.
  mongo:
    image: mongo:7
    profiles: ["local-mongo"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
